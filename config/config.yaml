# Default profile. Values can be overridden via .env (see core/config.py).
base_url: "https://www.ebay.com"

browser:
  name: "chromium"        # chromium | firefox | webkit
  headless: true
  slow_mo_ms: 0           # set >0 to watch runs locally
  viewport:
    width: 1366
    height: 900

timeouts:
  default_ms: 15000       # Playwright auto-wait ceiling
  navigation_ms: 30000

# Domain assumption (document in README): actual displayed currency depends
# on the runner's geolocation, not on a config value - parse_price() is
# currency-agnostic to handle this.
locale: "en-US"

artifacts:
  trace: true             # write trace.zip per test